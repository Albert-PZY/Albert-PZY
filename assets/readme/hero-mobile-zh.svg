    <rect x="512" y="493" width="224" height="37" rx="9" fill="none" stroke="#d7ff4f" stroke-width="1.5"/>
    <text x="624" y="427" text-anchor="middle" fill="#f3f5ea" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="26">流式</text>
    <text x="624" y="473" text-anchor="middle" fill="#f3f5ea" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="26">上下文</text>
    <text x="624" y="519" text-anchor="middle" fill="#f3f5ea" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="26">本地</text>
