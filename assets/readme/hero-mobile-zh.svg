<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Albert 的个人主页移动版</title>
  <desc id="desc">Albert：专注于 AI 应用、本地优先工具和细致界面的全栈工程师。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#252d24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="798" height="598" rx="26" fill="#10130f" stroke="#353d33" stroke-width="2"/>
  <rect x="2" y="2" width="796" height="596" rx="25" fill="url(#grid)" opacity="0.48"/>

  <g id="identity">
    <text x="48" y="58" fill="#a9b0a4" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="25" letter-spacing="2">ALBERT / 个人主页</text>
    <rect x="48" y="78" width="44" height="5" rx="2.5" fill="#d7ff4f"/>
    <circle cx="727" cy="65" r="12" fill="#d7ff4f"/>
    <circle cx="727" cy="65" r="28" fill="none" stroke="#d7ff4f" stroke-width="1" opacity="0.55"/>
    <text x="44" y="165" fill="#f3f5ea" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="88" font-weight="700" letter-spacing="2">ALBERT</text>
    <text x="48" y="213" fill="#f3f5ea" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500">专注于 AI 应用与开发者工具</text>
    <text x="48" y="250" fill="#f3f5ea" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500">的全栈工程师</text>
    <text x="48" y="300" fill="#d7ff4f" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="24" font-weight="600">Everything is cheap, show me your prompts.</text>
  </g>

  <path d="M48 335H752" stroke="#353d33" stroke-width="2"/>

  <g id="working-map">
    <rect x="32" y="355" width="736" height="224" rx="18" fill="#171c16" stroke="#3b4638" stroke-width="1"/>
    <text x="56" y="385" fill="#d7ff4f" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="24" font-weight="700" letter-spacing="1">工作流</text>

    <rect x="56" y="409" width="174" height="56" rx="10" fill="none" stroke="#8ed8d2" stroke-width="2"/>
    <circle cx="75" cy="437" r="6" fill="#8ed8d2"/>
    <text x="94" y="446" fill="#f3f5ea" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="28">提示词</text>
    <path d="M230 437H260" stroke="#8ed8d2" stroke-width="3"/>
    <path d="M250 429L262 437L250 445" fill="none" stroke="#8ed8d2" stroke-width="3"/>

