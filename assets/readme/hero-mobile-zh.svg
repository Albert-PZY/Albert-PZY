    <text x="373" y="446" text-anchor="middle" fill="#172018" font-family="'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace" font-size="28" font-weight="700">RAG · Agent</text>

    <path d="M483 420H509M483 456H509M483 492H509" stroke="#d7ff4f" stroke-width="3"/>
    <path d="M499 414L511 420L499 426M499 450L511 456L499 462M499 486L511 492L499 498" fill="none" stroke="#d7ff4f" stroke-width="3"/>
    <rect x="512" y="401" width="224" height="37" rx="9" fill="none" stroke="#d7ff4f" stroke-width="1.5"/>
